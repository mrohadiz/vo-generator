      <script>
      const WINS = [[0.0, 1.68], [1.68, 2.62], [2.62, 3.68], [3.68, 5.65], [6.7, 8.46], [8.46, 9.04], [9.04, 10.48], [10.48, 11.38], [11.38, 12.14], [12.14, 13.44], [13.44, 14.97], [15.96, 16.78], [16.78, 18.35], [19.36, 21.44], [21.44, 22.84], [22.84, 24.56], [24.56, 25.58], [25.58, 26.88], [26.88, 29.0], [29.0, 30.3], [30.3, 31.82], [31.82, 33.82], [33.82, 35.44], [35.44, 36.68], [36.68, 39.8]];
      const TIMINGS = [[0.0, 0.68], [0.68, 0.98], [0.98, 1.38], [1.38, 1.72], [1.72, 2.0], [2.0, 2.34], [2.34, 2.66], [2.66, 2.96], [2.96, 3.48], [3.48, 3.72], [3.72, 4.14], [4.14, 4.68], [4.68, 5.3], [6.74, 7.24], [7.24, 7.54], [7.54, 7.72], [7.72, 8.2], [8.5, 8.84], [8.84, 9.08], [9.08, 9.64], [9.64, 9.96], [9.96, 10.52], [10.52, 10.88], [10.88, 11.14], [11.14, 11.42], [11.42, 11.6], [11.6, 12.18], [12.18, 12.64], [12.64, 12.94], [12.94, 13.22], [13.22, 13.48], [13.48, 13.92], [13.92, 14.1], [14.1, 14.62], [16.0, 16.42], [16.42, 16.82], [16.82, 17.06], [17.06, 17.48], [17.48, 17.72], [17.72, 18.0], [19.4, 20.12], [20.12, 20.66], [20.66, 20.92], [20.92, 21.48], [21.48, 21.92], [21.92, 22.14], [22.14, 22.62], [22.88, 23.26], [23.26, 23.391], [23.391, 23.72], [23.72, 24.24], [24.24, 24.6], [24.6, 24.94], [24.94, 25.24], [25.24, 25.48], [25.48, 25.62], [25.62, 26.02], [26.02, 26.22], [26.22, 26.92], [26.92, 28.06], [28.06, 28.46], [28.46, 29.04], [29.04, 29.4], [29.4, 29.72], [29.72, 30.34], [30.34, 30.94], [30.94, 31.2], [31.2, 31.42], [31.42, 31.86], [31.86, 32.18], [32.18, 32.6], [32.6, 32.84], [32.84, 33.44], [33.86, 34.4], [34.4, 34.7], [34.7, 35.1], [35.1, 35.48], [35.48, 35.74], [35.74, 36.08], [36.08, 36.52], [36.52, 36.72], [36.72, 36.94], [36.94, 37.78], [37.78, 37.98], [37.98, 38.74]];
      const DURATION = 39.8;
      const tl = gsap.timeline({ paused: true });

      // grup: muncul sekali, mati keras setelah selesai
      WINS.forEach((w, n) => {
        tl.fromTo("#g" + n, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.14, ease: "power2.out" }, w[0]);
        tl.set("#g" + n, { opacity: 0 }, w[1]);
      });
      tl.to("#g24", { opacity: 0, duration: 0.8, ease: "sine.in" }, DURATION - 0.8);

      // asr-keyword-glow, gaya karaoke: satu driver linear, envelope attack-sustain-release per kata
      const ATTACK = 0.10, RELEASE = 0.40, REST = 0.55, MAX_BLUR = 26, MAX_SCALE = 0.05;
      const REST_RGB = [178, 172, 165], FINALE_REST_RGB = [204, 199, 192], ACTIVE_RGB = [234, 227, 214], EMBER = [208, 139, 91];
      const els = Array.from(document.querySelectorAll("#captions .w"));
      const lerp = (a, b, t) => Math.round(a + (b - a) * t);
      function envelope(time, s, e) {
        if (time < s) return 0;
        if (time < e) return Math.min((time - s) / ATTACK, 1);
        if (time < e + RELEASE) return 1 - ((time - e) / RELEASE) * (1 - REST);
        return REST;
      }
      const driver = { t: 0 };
      tl.to(driver, { t: DURATION, duration: DURATION, ease: "none", onUpdate: () => {
        els.forEach((el) => {
          const tm = TIMINGS[+el.dataset.w];
          const env = envelope(driver.t, tm[0], tm[1]);
          const glow = Math.max(0, (env - REST) / (1 - REST));
          const base = el.parentElement.classList.contains("finale") ? FINALE_REST_RGB : REST_RGB;
          const c = [0, 1, 2].map((k) => lerp(base[k], ACTIVE_RGB[k], env));
          el.style.color = "rgb(" + c.join(",") + ")";
          el.style.textShadow = "0 2px 30px rgba(10,13,18,0.6), 0 0 " + (MAX_BLUR * glow).toFixed(1) + "px rgba(" + EMBER.join(",") + "," + (0.75 * glow).toFixed(3) + ")";
          el.style.transform = "scale(" + (1 + MAX_SCALE * glow).toFixed(4) + ")";
        });
      } }, 0);

      window.__timelines["captions"] = tl;
      </script>
