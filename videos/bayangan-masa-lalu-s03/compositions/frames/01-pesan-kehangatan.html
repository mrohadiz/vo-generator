<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #frame-01 { position: absolute; inset: 0; overflow: hidden; background: #0A0D12; }
        #f01-fade { position: absolute; inset: 0; }
        #f01-cam { position: absolute; inset: 0; transform-origin: 50% 50%; will-change: transform; }
        #f01-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 62% 50%; }
        #f01-bloom { position:absolute; left:0; top:36%; width:100%; height:44%; opacity:0; background: radial-gradient(ellipse at 38% 50%, #7A4E33 0%, rgba(122,78,51,0.55) 35%, rgba(122,78,51,0) 70%); will-change: opacity, transform; }
      </style>
      <div id="frame-01" data-composition-id="frame-01" data-width="1080" data-height="1920">
        <div id="f01-fade">
          <div id="f01-cam">
            <video id="f01-video" src="assets/broll/B1_42408.mp4" muted playsinline
              data-start="0" data-duration="19.1" data-media-start="0.5" data-track-index="0"></video>
          </div>
          <div class="bloom" id="f01-bloom"></div>
        </div>
      </div>
      <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f01-fade", { opacity: 0 }, { opacity: 1, duration: 1.2, ease: "sine.inOut" }, 0);
      
      // multi-phase-camera: skala lambat + drift mikro; satu-satunya penulis transform kamera
      const cam = document.getElementById("f01-cam");
      const ph = { s: 1.06 };
      tl.to(ph, { s: 1.124, duration: 19.1, ease: "sine.inOut" }, 0);
      const dr = { p: 0 };
      tl.to(dr, { p: Math.PI * 2 * 1, duration: 19.1, ease: "none", onUpdate: () => {
        const dx = Math.sin(dr.p) * 9, dy = Math.sin(dr.p * 1.3 + 1.1) * 6;
        cam.style.transform = "translate(" + dx.toFixed(2) + "px," + dy.toFixed(2) + "px) scale(" + ph.s.toFixed(4) + ")";
      } }, 0);
      // ambient-glow-bloom: mekar pelan lalu napas terbatas (bukan yoyo)
      const bloom = document.getElementById("f01-bloom");
      tl.fromTo("#f01-bloom", { opacity: 0, scale: 0.92 }, { opacity: 0.28, scale: 1, duration: 2.2, ease: "power2.out" }, 0.6);
      const bp = { p: 0 };
      tl.to(bp, { p: Math.PI * 2 * 2, duration: 16.3, ease: "none", onUpdate: () => {
        const s = Math.sin(bp.p);
        bloom.style.opacity = String(0.28 + s * 0.05);
        bloom.style.transform = "scale(" + (1 + s * 0.03) + ")";
      } }, 2.8);
      window.__timelines["frame-01"] = tl;
      </script>
    </template>
  </body>
</html>
